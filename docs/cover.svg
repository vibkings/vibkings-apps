<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Vibkings Docs cover: a draft with the watermark beside the finished,
       clean copy with its ₦1,000 tick, on the brand's night navy.
       Kept inside y 150–750 so the 8:3 page banner still shows it. -->
  <defs>
    <radialGradient id="g1" cx="18%" cy="20%" r="60%">
      <stop offset="0" stop-color="#1f8f6b" stop-opacity=".55"/><stop offset="1" stop-color="#1f8f6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="90%" cy="85%" r="55%">
      <stop offset="0" stop-color="#e0a83f" stop-opacity=".30"/><stop offset="1" stop-color="#e0a83f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="draftClip"><rect width="440" height="560" rx="18"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#06070d"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- the draft, behind, with its watermark -->
  <g transform="translate(330 190) rotate(-6)">
    <rect width="440" height="560" rx="18" fill="#e9edeb"/>
    <g clip-path="url(#draftClip)">
      <rect x="40" y="56" width="220" height="18" rx="9" fill="#17201c" fill-opacity=".55"/>
      <rect x="40" y="106" width="360" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <rect x="40" y="136" width="320" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <rect x="40" y="166" width="340" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <rect x="40" y="226" width="300" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <rect x="40" y="256" width="350" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <rect x="40" y="316" width="280" height="12" rx="6" fill="#17201c" fill-opacity=".22"/>
      <g fill="#b45309" fill-opacity=".38" font-family="system-ui, sans-serif" font-weight="700" font-size="30" letter-spacing="2" transform="rotate(-30 220 280)">
        <text x="-60" y="200">VIBKINGS GLOBAL LIMITED DRAFT</text>
        <text x="-40" y="330">VIBKINGS GLOBAL LIMITED DRAFT</text>
        <text x="-20" y="460">VIBKINGS GLOBAL LIMITED DRAFT</text>
      </g>
    </g>
  </g>

  <!-- the finished copy, in front -->
  <g transform="translate(800 170) rotate(4)">
    <rect width="460" height="580" rx="18" fill="#ffffff"/>
    <rect x="40" y="48" width="180" height="16" rx="8" fill="#0d5c47"/>
    <rect x="40" y="76" width="240" height="10" rx="5" fill="#17201c" fill-opacity=".3"/>
    <rect x="40" y="104" width="380" height="3" fill="#17201c"/>
    <rect x="120" y="138" width="220" height="18" rx="9" fill="#17201c" fill-opacity=".8"/>
    <rect x="40" y="190" width="150" height="13" rx="6" fill="#17201c" fill-opacity=".7"/>
    <rect x="40" y="216" width="370" height="11" rx="5" fill="#17201c" fill-opacity=".25"/>
    <rect x="40" y="240" width="340" height="11" rx="5" fill="#17201c" fill-opacity=".25"/>
    <rect x="40" y="280" width="170" height="13" rx="6" fill="#17201c" fill-opacity=".7"/>
    <rect x="40" y="306" width="360" height="11" rx="5" fill="#17201c" fill-opacity=".25"/>
    <rect x="40" y="330" width="310" height="11" rx="5" fill="#17201c" fill-opacity=".25"/>
    <rect x="40" y="370" width="130" height="13" rx="6" fill="#17201c" fill-opacity=".7"/>
    <rect x="40" y="396" width="350" height="11" rx="5" fill="#17201c" fill-opacity=".25"/>
    <path d="M44 500 C70 470 90 520 118 488 S160 470 190 494" fill="none" stroke="#17201c" stroke-width="4" stroke-linecap="round"/>
    <rect x="40" y="516" width="170" height="3" fill="#17201c" fill-opacity=".5"/>
  </g>

  <!-- the ₦1,000 tick -->
  <g transform="translate(1230 610)">
    <circle r="92" fill="#3fbf7f" stroke="#06070d" stroke-width="10"/>
    <path d="M-40 -6 L-10 24 L44 -32" fill="none" stroke="#06180f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-86" y="102" width="172" height="52" rx="26" fill="#e0a83f"/>
    <text x="0" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="30" fill="#06180f">₦1,000</text>
  </g>
</svg>
