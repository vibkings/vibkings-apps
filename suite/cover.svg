<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Vibkings Suite cover: a business dashboard on the brand's night navy.
       Kept inside y 150–750 so the 8:3 page banner (which crops top and bottom) still shows it. -->
  <defs>
    <radialGradient id="g1" cx="18%" cy="20%" r="60%">
      <stop offset="0" stop-color="#2f3fd6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f3fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="85%" r="55%">
      <stop offset="0" stop-color="#ef4b39" stop-opacity=".40"/>
      <stop offset="1" stop-color="#ef4b39" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="70%" cy="5%" r="40%">
      <stop offset="0" stop-color="#e0a83f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e0a83f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a83f"/>
      <stop offset="1" stop-color="#c47a1c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#ef4b39"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#06070d"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>
  <rect width="1600" height="900" fill="url(#g3)"/>

  <!-- dashboard window -->
  <g transform="translate(260 150)">
    <rect width="1080" height="600" rx="26" fill="#0e1117" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
    <!-- title bar -->
    <circle cx="34" cy="32" r="8" fill="#ef4b39"/>
    <circle cx="60" cy="32" r="8" fill="#e0a83f"/>
    <circle cx="86" cy="32" r="8" fill="#3fbf7f"/>
    <rect x="0" y="62" width="1080" height="2" fill="#ffffff" fill-opacity=".08"/>

    <!-- sidebar -->
    <rect x="0" y="64" width="190" height="536" fill="#ffffff" fill-opacity=".03"/>
    <rect x="28" y="96" width="44" height="44" rx="10" fill="#2f3fd6"/>
    <rect x="28" y="172" width="130" height="14" rx="7" fill="#ffffff" fill-opacity=".30"/>
    <rect x="28" y="212" width="110" height="14" rx="7" fill="#ffffff" fill-opacity=".16"/>
    <rect x="28" y="252" width="122" height="14" rx="7" fill="#ffffff" fill-opacity=".16"/>
    <rect x="28" y="292" width="96" height="14" rx="7" fill="#ffffff" fill-opacity=".16"/>
    <rect x="28" y="332" width="116" height="14" rx="7" fill="#ffffff" fill-opacity=".16"/>
    <rect x="28" y="372" width="88" height="14" rx="7" fill="#ffffff" fill-opacity=".16"/>

    <!-- KPI cards -->
    <g transform="translate(222 96)">
      <rect width="250" height="112" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="24" y="26" width="90" height="12" rx="6" fill="#ffffff" fill-opacity=".30"/>
      <rect x="24" y="56" width="150" height="28" rx="8" fill="#3fbf7f"/>
    </g>
    <g transform="translate(494 96)">
      <rect width="250" height="112" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="24" y="26" width="110" height="12" rx="6" fill="#ffffff" fill-opacity=".30"/>
      <rect x="24" y="56" width="120" height="28" rx="8" fill="#e0a83f"/>
    </g>
    <g transform="translate(766 96)">
      <rect width="286" height="112" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="24" y="26" width="80" height="12" rx="6" fill="#ffffff" fill-opacity=".30"/>
      <rect x="24" y="56" width="170" height="28" rx="8" fill="#6d7cff"/>
    </g>

    <!-- sales chart -->
    <g transform="translate(222 232)">
      <rect width="522" height="340" rx="16" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="24" y="24" width="140" height="12" rx="6" fill="#ffffff" fill-opacity=".30"/>
      <g fill="url(#bar)">
        <rect x="40"  y="200" width="40" height="110" rx="8"/>
        <rect x="104" y="170" width="40" height="140" rx="8"/>
        <rect x="168" y="215" width="40" height="95"  rx="8"/>
        <rect x="232" y="140" width="40" height="170" rx="8"/>
        <rect x="296" y="160" width="40" height="150" rx="8"/>
        <rect x="360" y="110" width="40" height="200" rx="8"/>
        <rect x="424" y="80"  width="40" height="230" rx="8"/>
      </g>
      <polyline points="60,170 124,150 188,185 252,118 316,132 380,90 444,62"
                fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- stock list -->
    <g transform="translate(766 232)">
      <rect width="286" height="340" rx="16" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="24" y="24" width="100" height="12" rx="6" fill="#ffffff" fill-opacity=".30"/>
      <g>
        <rect x="24" y="64"  width="40" height="40" rx="10" fill="#2f3fd6"/>
        <rect x="80" y="70"  width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".28"/>
        <rect x="80" y="90"  width="70"  height="10" rx="5" fill="#ffffff" fill-opacity=".12"/>
        <rect x="216" y="74" width="46" height="20" rx="10" fill="#3fbf7f" fill-opacity=".85"/>

        <rect x="24" y="128" width="40" height="40" rx="10" fill="#ef4b39"/>
        <rect x="80" y="134" width="104" height="12" rx="6" fill="#ffffff" fill-opacity=".28"/>
        <rect x="80" y="154" width="84"  height="10" rx="5" fill="#ffffff" fill-opacity=".12"/>
        <rect x="216" y="138" width="46" height="20" rx="10" fill="#e0a83f" fill-opacity=".9"/>

        <rect x="24" y="192" width="40" height="40" rx="10" fill="#e0a83f"/>
        <rect x="80" y="198" width="128" height="12" rx="6" fill="#ffffff" fill-opacity=".28"/>
        <rect x="80" y="218" width="60"  height="10" rx="5" fill="#ffffff" fill-opacity=".12"/>
        <rect x="216" y="202" width="46" height="20" rx="10" fill="#3fbf7f" fill-opacity=".85"/>

        <rect x="24" y="256" width="40" height="40" rx="10" fill="#6d7cff"/>
        <rect x="80" y="262" width="96"  height="12" rx="6" fill="#ffffff" fill-opacity=".28"/>
        <rect x="80" y="282" width="76"  height="10" rx="5" fill="#ffffff" fill-opacity=".12"/>
        <rect x="216" y="266" width="46" height="20" rx="10" fill="#ef4b39" fill-opacity=".9"/>
      </g>
    </g>
  </g>
</svg>
