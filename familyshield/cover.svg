<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Family Shield cover: a parent's phone showing the child's place, screen time and an alert.
       Kept inside y 150–750 so the 8:3 page banner (which crops top and bottom) still shows it. -->
  <defs>
    <radialGradient id="g1" cx="80%" cy="15%" r="60%">
      <stop offset="0" stop-color="#1f8f6b" stop-opacity=".60"/>
      <stop offset="1" stop-color="#1f8f6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="90%" r="55%">
      <stop offset="0" stop-color="#3B7BFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd1a0"/><stop offset="1" stop-color="#1f8f6b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0B1330"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- big shield, left -->
  <g transform="translate(250 190)">
    <path d="M220 0 L440 76 V262 C440 406 344 506 220 548 C96 506 0 406 0 262 V76 Z" fill="url(#shield)" fill-opacity=".92"/>
    <circle cx="170" cy="210" r="52" fill="#0B1330" fill-opacity=".85"/>
    <path d="M80 400 C80 320 120 286 170 286 C220 286 260 320 260 400 Z" fill="#0B1330" fill-opacity=".85"/>
    <circle cx="300" cy="266" r="36" fill="#0B1330" fill-opacity=".6"/>
    <path d="M240 404 C240 352 266 328 300 328 C334 328 360 352 360 404 Z" fill="#0B1330" fill-opacity=".6"/>
  </g>

  <!-- parent's phone, right -->
  <g transform="translate(900 160)">
    <rect width="380" height="600" rx="44" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="3"/>
    <rect x="150" y="22" width="80" height="10" rx="5" fill="#ffffff" fill-opacity=".25"/>

    <!-- location card -->
    <rect x="28" y="60" width="324" height="150" rx="22" fill="#ffffff" fill-opacity=".09"/>
    <circle cx="72" cy="104" r="16" fill="#3fd1a0"/>
    <circle cx="72" cy="104" r="6" fill="#0B1330"/>
    <rect x="102" y="92" width="120" height="16" rx="8" fill="#ffffff" fill-opacity=".85"/>
    <rect x="102" y="120" width="190" height="12" rx="6" fill="#ffffff" fill-opacity=".35"/>
    <rect x="52" y="154" width="276" height="34" rx="17" fill="#3fd1a0" fill-opacity=".25"/>
    <rect x="70" y="166" width="140" height="10" rx="5" fill="#3fd1a0"/>

    <!-- screen time card -->
    <rect x="28" y="230" width="324" height="150" rx="22" fill="#ffffff" fill-opacity=".09"/>
    <circle cx="72" cy="276" r="16" fill="none" stroke="#b48cff" stroke-width="5"/>
    <path d="M72 266 V277 L80 283" stroke="#b48cff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="102" y="264" width="150" height="16" rx="8" fill="#ffffff" fill-opacity=".85"/>
    <rect x="102" y="292" width="200" height="12" rx="6" fill="#ffffff" fill-opacity=".35"/>
    <rect x="52" y="326" width="132" height="34" rx="17" fill="#b48cff"/>
    <rect x="196" y="326" width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>

    <!-- alert card -->
    <rect x="28" y="400" width="324" height="150" rx="22" fill="#ef4b39" fill-opacity=".18" stroke="#ef4b39" stroke-opacity=".7" stroke-width="3"/>
    <circle cx="72" cy="446" r="16" fill="#ef4b39"/>
    <rect x="68" y="436" width="8" height="13" rx="3" fill="#ffffff"/>
    <rect x="68" y="452" width="8" height="6" rx="3" fill="#ffffff"/>
    <rect x="102" y="434" width="110" height="16" rx="8" fill="#ffffff" fill-opacity=".9"/>
    <rect x="102" y="462" width="210" height="12" rx="6" fill="#ffffff" fill-opacity=".35"/>
    <rect x="52" y="496" width="276" height="34" rx="17" fill="#ef4b39"/>
  </g>
</svg>
