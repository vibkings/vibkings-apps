<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Vibkings Hub cover: a marketplace of shop cards on the Hub's own blue.
       Kept inside y 150–750 so the 8:3 page banner (which crops top and bottom) still shows it. -->
  <defs>
    <radialGradient id="g1" cx="80%" cy="15%" r="60%">
      <stop offset="0" stop-color="#3B7BFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="90%" r="55%">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#1f4fd1"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ef4b39"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd1a0"/><stop offset="1" stop-color="#1f9f78"/>
    </linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b48cff"/><stop offset="1" stop-color="#7a52e0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0B1330"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- search bar -->
  <g transform="translate(400 160)">
    <rect width="800" height="74" rx="37" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="48" cy="37" r="14" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="5"/>
    <line x1="58" y1="47" x2="70" y2="59" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <rect x="96" y="29" width="300" height="16" rx="8" fill="#ffffff" fill-opacity=".30"/>
    <rect x="660" y="14" width="124" height="46" rx="23" fill="#3B7BFF"/>
  </g>

  <!-- shop / product cards -->
  <g transform="translate(150 290)">
    <!-- card 1 -->
    <g>
      <rect width="300" height="420" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
      <rect x="18" y="18" width="264" height="200" rx="16" fill="url(#p1)"/>
      <!-- storefront awning -->
      <path d="M78 96 h144 l14 34 h-172 z" fill="#ffffff" fill-opacity=".9"/>
      <rect x="92" y="130" width="116" height="62" rx="6" fill="#ffffff" fill-opacity=".35"/>
      <rect x="18" y="242" width="190" height="16" rx="8" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="272" width="130" height="12" rx="6" fill="#ffffff" fill-opacity=".22"/>
      <g fill="#ffc94a"><circle cx="30" cy="316" r="8"/><circle cx="54" cy="316" r="8"/><circle cx="78" cy="316" r="8"/><circle cx="102" cy="316" r="8"/></g>
      <rect x="18" y="352" width="264" height="48" rx="14" fill="#3B7BFF"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(340 0)">
      <rect width="300" height="420" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
      <rect x="18" y="18" width="264" height="200" rx="16" fill="url(#p2)"/>
      <!-- shopping bag -->
      <rect x="104" y="92" width="92" height="96" rx="12" fill="#ffffff" fill-opacity=".9"/>
      <path d="M124 92 v-12 a26 26 0 0 1 52 0 v12" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="8"/>
      <rect x="18" y="242" width="160" height="16" rx="8" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="272" width="110" height="12" rx="6" fill="#ffffff" fill-opacity=".22"/>
      <g fill="#ffc94a"><circle cx="30" cy="316" r="8"/><circle cx="54" cy="316" r="8"/><circle cx="78" cy="316" r="8"/><circle cx="102" cy="316" r="8"/><circle cx="126" cy="316" r="8"/></g>
      <rect x="18" y="352" width="264" height="48" rx="14" fill="#3B7BFF"/>
    </g>
    <!-- card 3 -->
    <g transform="translate(680 0)">
      <rect width="300" height="420" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
      <rect x="18" y="18" width="264" height="200" rx="16" fill="url(#p3)"/>
      <!-- box -->
      <path d="M150 82 l62 30 v66 l-62 30 l-62 -30 v-66 z" fill="#ffffff" fill-opacity=".9"/>
      <path d="M88 112 l62 30 l62 -30 M150 142 v66" fill="none" stroke="#1f9f78" stroke-width="5"/>
      <rect x="18" y="242" width="200" height="16" rx="8" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="272" width="140" height="12" rx="6" fill="#ffffff" fill-opacity=".22"/>
      <g fill="#ffc94a"><circle cx="30" cy="316" r="8"/><circle cx="54" cy="316" r="8"/><circle cx="78" cy="316" r="8"/><circle cx="102" cy="316" r="8"/></g>
      <rect x="18" y="352" width="264" height="48" rx="14" fill="#3B7BFF"/>
    </g>
    <!-- card 4 -->
    <g transform="translate(1020 0)">
      <rect width="300" height="420" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
      <rect x="18" y="18" width="264" height="200" rx="16" fill="url(#p4)"/>
      <!-- map pin -->
      <path d="M150 74 a46 46 0 0 1 46 46 c0 36 -46 80 -46 80 s-46 -44 -46 -80 a46 46 0 0 1 46 -46 z" fill="#ffffff" fill-opacity=".9"/>
      <circle cx="150" cy="120" r="16" fill="#7a52e0"/>
      <rect x="18" y="242" width="176" height="16" rx="8" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="272" width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".22"/>
      <g fill="#ffc94a"><circle cx="30" cy="316" r="8"/><circle cx="54" cy="316" r="8"/><circle cx="78" cy="316" r="8"/><circle cx="102" cy="316" r="8"/><circle cx="126" cy="316" r="8"/></g>
      <rect x="18" y="352" width="264" height="48" rx="14" fill="#3B7BFF"/>
    </g>
  </g>
</svg>
